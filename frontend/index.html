<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#54c2f2" />
    <meta name="description" content="Discover technology, ideas, and community events happening across Hyderabad with ORBIT." />
    <meta property="og:site_name" content="ORBIT" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="ORBIT — Hyderabad's Weekend Field Guide" />
    <meta property="og:description" content="Discover technology, ideas, and community events happening across Hyderabad." />
    <meta name="twitter:card" content="summary" />
    <meta name="robots" content="index, follow" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="color-scheme" content="light dark" />
    <script>
      try {
        const savedTheme = localStorage.getItem('orbit-color-scheme');
        document.documentElement.dataset.theme = savedTheme === 'light' || savedTheme === 'dark'
          ? savedTheme
          : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      } catch (error) {
        console.error('ORBIT could not read the saved color scheme.', error);
        document.documentElement.dataset.theme =
          matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fragment+Mono&family=Google+Sans+Flex:opsz,wght@6..144,400..800&display=swap" rel="stylesheet" />
    <title>ORBIT — Hyderabad's Weekend Field Guide</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>ORBIT needs JavaScript to load current event listings and interactive features.</noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>The Orbit · Tech events in Hyderabad, every weekend</title>
    <meta name="description" content="The Orbit lists Hyderabad's tech events every week: meetups, workshops, hackathons and talks, with times, venues and registration links in one place." />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#000000" />

    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Public site type: Inter Tight (text) + Instrument Serif italic (emphasis). Admin fonts load with the admin stylesheet. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500&family=Instrument+Serif:ital@1&display=swap" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="The Orbit" />
    <meta property="og:locale" content="en_IN" />
    <meta property="og:title" content="The Orbit · Tech events in Hyderabad, every weekend" />
    <meta property="og:description" content="Meetups, workshops, hackathons and talks across Hyderabad, gathered into one weekly guide." />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:image" content="%SITE_URL%/brand/orbit-social.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The Orbit Community logo" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="The Orbit · Tech events in Hyderabad, every weekend" />
    <meta name="twitter:description" content="Meetups, workshops, hackathons and talks across Hyderabad, gathered into one weekly guide." />
    <meta name="twitter:image" content="%SITE_URL%/brand/orbit-social.png" />
    <meta name="twitter:image:alt" content="The Orbit Community logo" />

    <!-- Replaced per route at runtime; serves crawlers that do not execute JavaScript. -->

      {"@context":"https://schema.org","@graph":[{"@type":"WebSite","@id":"%SITE_URL%/#website","url":"%SITE_URL%/","name":"The Orbit","inLanguage":"en-IN","publisher":{"@id":"%SITE_URL%/#organization"}},{"@type":"Organization","@id":"%SITE_URL%/#organization","name":"The Orbit","url":"%SITE_URL%/","logo":"%SITE_URL%/brand/orbit-stacked-dark.png","areaServed":{"@type":"City","name":"Hyderabad"}}]}
